##########################################################################
# stage: run

run_yyML-nom:
 <<: *asg
 <<: *asg_setup
 <<: *yyML-nom_script
 stage: run
 dependencies:
   - asg_compile
 artifacts:
   paths:
     - run/sampleFolders
     - run/results
   name: "${CI_JOB_NAME}"
   expire_in: 3 mos

run_checks:
  <<: *asg
  <<: *asg_setup
  stage: run
  script:
    - source tools/CI_checks.sh
    - set +e
    - yyMLAnalysis_checkMapFiles

