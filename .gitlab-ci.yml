##########################################################################
# preamble
##########################################################################

stages:
  - build
  - run
  - docker

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SSL_NO_VERIFY: "true"

##########################################################################
# job defaults

.asg: &asg
  image: gitlab-registry.cern.ch/atlas/athena/analysisbase:25.2.27
  tags:
    - cvmfs

.standalone: &standalone
  image: gitlab-registry.cern.ch/atlas-caf/cafcore/standalone-base:root6.22.06-python3.8
  tags:
    - cvmfs

.asg_setup: &asg_setup
  before_script:
    - if [ -z "$KRB_USERNAME" ]; then exit 0; fi
    - source /home/atlas/release_setup.sh
    - pwd
    - mkdir -p ~/.ssh
    - source ~/.bashrc || echo ignore alrb
    - echo "${KRB_PASSWORD}" | kinit ${KRB_USERNAME}@CERN.CH
    - klist
    - echo -e "Host svn.cern.ch lxplus.cern.ch\n\tUser ${CERN_USER}\n\tStrictHostKeyChecking no\n\tGSSAPIAuthentication yes\n\tGSSAPIDelegateCredentials yes\n\tProtocol 2\n\tForwardX11 no\n\tIdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
    - cat ~/.ssh/config
    - sed -i 's|CAFANALYSISBASE/../output|CAFANALYSISBASE/run|' setup/setupLocal.sh

.yyML-nom_script: &yyML-nom_script
  script:
    - source build/setupAnalysis.sh
    - mkdir run
    - cd run
    - prepare.py config/master/yyML/prepare-yyML-nom.cfg --snowflakeThresh 0 --options XsecWhitelist=config/samples/whitelists/common/whitelist-v1.txt outputFile=sampleFolders/prepared/samples-prepared-yyML-nom-test.root
    - initialize.py config/master/yyML/initialize-yyML-nom.cfg --snowflakeThresh 1 --options campaignsConfig=config/master/common/campaigns-yyML-v1-eos.cfg inputFile=sampleFolders/prepared/samples-prepared-yyML-nom-test.root outputFile=sampleFolders/initialized/samples-initialized-yyML-nom-test.root lineUpdates=false consoleWidth=160
    - analyze.py config/master/yyML/analyze-yyML-nom.cfg --snowflakeThresh 3 --options inputFile=sampleFolders/initialized/samples-initialized-yyML-nom-test.root outputFile=sampleFolders/analyzed/samples-analyzed-yyML-nom-test.root lineUpdates=false consoleWidth=160 maxEvents=100
    - visualize.py config/master/yyML/visualize-yyML-nom.cfg --snowflakeThresh 50 --options inputFile=sampleFolders/analyzed/samples-analyzed-yyML-nom-test.root outputFile=sampleFolders/visualized/samples-visualized-yyML-nom-test.root outputDir=results/yyML-test

##########################################################################
# job definitions
##########################################################################
# stage: build

asg_compile:
  <<: *asg
  stage: build
  script:
    - source /home/atlas/release_setup.sh
    - mkdir build
    - cd build
    - cmake ..
    - make -j4
  artifacts:
    expire_in: 3d
    untracked: true
    paths:
      - build
      - CAFCore/cafsetup.sh

