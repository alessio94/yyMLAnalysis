# -*- mode: config -*-
# CAF initialize config for Z'+MET analysis (ANA-EXOT-2023-28)
# Links input flat ntuples (EasyJet TTree output) to SampleFolders

[initialize]

# ── Input/Output ──────────────────────────────────────────────────────────────
inputFile:   sampleFolders/prepared/samples-prepared-ZpMET.root
outputFile:  sampleFolders/initialized/samples-initialized-ZpMET.root

# ── Input ntuple location ─────────────────────────────────────────────────────
# EasyJet signal ntuples on EOS (xrootd access)
mcFileList:      ZpMET/config/samples/inputFileLists/ZpMET-mcFileList.txt
mcFileListTreeName:  output   # TTree name inside the EasyJet ntuples — verify this!

# Alternative: direct EOS paths (comment out mcFileList above and use this)
# mcPaths: /eos/atlas/atlascerngroupdisk/phys-exotics/lpx/ANA-EXOT-2023-28_leptonsplusmet/ZpMET/Run3/ntuples/:output

# ── Normalization ─────────────────────────────────────────────────────────────
# Uses xsec * lumi * kFactor / sumWeights
normalize:  true

# ── Debugging ─────────────────────────────────────────────────────────────────
printSamplesFailed:  true
verbose:             true

# ── Channels ──────────────────────────────────────────────────────────────────
channels:            ee mm
channelPlaceholder:  channel
