# -*- mode: config -*-
# CAF prepare config for Z'+MET analysis (ANA-EXOT-2023-28)
# Modelled on share/config/master/yyML/prepare-yyML-nom.cfg

[prepare]

# ── Output ────────────────────────────────────────────────────────────────────
outputFile: sampleFolders/prepared/samples-prepared-ZpMET.root

# ── Cross-section files ───────────────────────────────────────────────────────
# Path mapping is done via XsecMap — the CSV must NOT have a 'path' column.
XsecFiles:     ZpMET/config/samples/XSec/ZpMET_XS_13p6TeV.csv
XsecWhitelist: ZpMET/config/samples/ZpMET-whitelist.txt
XsecMap:       ZpMET/config/samples/ZpMET.map
XsecUnit:      pb

# ── Energy ────────────────────────────────────────────────────────────────────
energy:    13.6
energyUnit: TeV

# ── Channels ──────────────────────────────────────────────────────────────────
channels:           ee, mm
channelPlaceholder: channel

# ── MC campaigns & per-campaign luminosity ────────────────────────────────────
# campaignsConfig MUST point to a file with one [campaign] section each,
# containing at least `luminosity: <value>`. This is what prepare.py reads.
campaignsConfig: ZpMET/config/master/ZpMET-luminosity.cfg
campaigns:       mc23a, mc23d, mc23e
luminosityUnit:  pb
