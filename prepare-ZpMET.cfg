# -*- mode: config -*-
# CAF prepare config for Z'+MET analysis (ANA-EXOT-2023-28)

[prepare]

# ── Output ────────────────────────────────────────────────────────────────────
outputFile: sampleFolders/prepared/samples-prepared-ZpMET.root

# ── Cross-section files ───────────────────────────────────────────────────────
# Path relative to share/ or absolute
XsecFiles:  ZpMET/config/samples/XSec/ZpMET_XS_13p6TeV.csv
XsecUnit:   pb

# ── Energy & luminosity (Run 3, full mc23) ────────────────────────────────────
luminosity:      140000.0
luminosityUnit:  pb
energy:          13.6
energyUnit:      TeV

# ── Channels ──────────────────────────────────────────────────────────────────
channels:            ee mm
channelPlaceholder:  channel

# ── MC campaigns ──────────────────────────────────────────────────────────────
# mc23a + mc23d + mc23e
campaigns:           mc23a mc23d mc23e
campaignPlaceholder: campaign

# ── Sample whitelist & path mapping ───────────────────────────────────────────
# Format: DSID  path/in/SampleFolder
# Signal: Z' -> ee (546587, 546588 = 500 GeV; ...; 546615, 546616 = 4000 GeV)
sampleFile:  ZpMET/config/samples/ZpMET-samples.txt

# ── Type flags (set on SampleFolders) ─────────────────────────────────────────
# These let CAF know which folders are MC vs data
bkgFolderPattern:   bkg
sigFolderPattern:   sig
dataFolderPattern:  data
