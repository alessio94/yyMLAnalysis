# -*- mode: config -*-
# CAF prepare config for Z'+MET analysis (ANA-EXOT-2023-28)
# Based on the working yyML reference (share/config/master/yyML/prepare-yyML-nom.cfg)

[prepare]

# ── Output ────────────────────────────────────────────────────────────────────
outputFile: sampleFolders/prepared/samples-prepared-ZpMET.root

# ── Cross-section files ───────────────────────────────────────────────────────
# IMPORTANT: the CSV MUST NOT contain a 'path' column. Path mapping is handled
# by the separate XsecMap file below. This was the root cause of the previous
# "[FAIL] reading path mapping from X-section file column 'path'" error.
XsecFiles:     ZpMET/config/samples/XSec/ZpMET_XS_13p6TeV.csv
XsecWhitelist: ZpMET/config/samples/ZpMET-whitelist.txt
XsecMap:       ZpMET/config/samples/ZpMET.map
XsecUnit:      pb

# ── Energy & luminosity (Run 3, full mc23) ────────────────────────────────────
luminosity:     140000.0
luminosityUnit: pb
energy:         13.6
energyUnit:     TeV

# ── Channels ──────────────────────────────────────────────────────────────────
# NOTE: use commas — this matches the yyML working reference
channels:           ee, mm
channelPlaceholder: channel

# ── MC campaigns ──────────────────────────────────────────────────────────────
campaigns:           mc23a, mc23d, mc23e
campaignPlaceholder: campaign
