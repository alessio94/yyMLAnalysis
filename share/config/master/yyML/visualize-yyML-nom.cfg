# -*- mode: config -*-

[visualize]

# name of the input file
inputFile: sampleFolders/analyzed/samples-analyzed-yyML-nom.root

# name of the output file
outputFile: sampleFolders/visualized/samples-visualized-yyML-nom.root

# name of the output folder
outputDir: results/yyML


patches: config/visualization/style/yyML/yyML-style.txt
makePlots: *
histogramProcesses: config/visualization/processes/yyML/yyML-plot-processes.txt
makeLogPlots: false
plotlabel: "HH#rightarrowyyML"
plotFormats: pdf, png
makeCutflows: true
cutflowFormats: txt, tex, html


cutflowProcessFiles: config/visualization/processes/yyML/yyML-cutflow-processes.txt
cutflowCutFiles: config/visualization/cuts/yyML/yyML-cutflow-cuts.txt

# configure plotter for nice plots
plotter.labels.atlas: Internal
plotter.blocks.x.0: 1
plotter.blocks.y.0: 0.75
plotter.geometry.main.xAxis.titleOffset: 1.3
plotter.geometry.main.yAxis.titleOffset: 1.7

# channels to run over
channels: yyML

channelConfig: config/channels/common/channels.txt
