# -*- mode: config -*-

[initialize]

# name of the input file
inputFile: sampleFolders/prepared/samples-prepared-2LSC.root

# name of the output file
outputFile: sampleFolders/initialized/samples-initialized-2LSC.root

# for using the same input file as above, but on afs (use just one or the other)
mcPaths: /eos/user/a/atlascaf/tutorial/latest/Easyjet_Example/mc23a:AnalysisMiniTree

# some debugging options for the sample initializer
# initialize: false
printSamplesFailed: true
verbose: true

# channels to run over
channels: inclusive
channelPlaceholder: channel
initializer.useCountHistogram: true
initializer.countHistogramName: CutBookkeeper_300000_NOSYS
initializer.countHistogramBinNumber: 2

# preInit patch files to apply
preInit_patches: easyjet_example/config/patches/easyjet-default-patch.txt
