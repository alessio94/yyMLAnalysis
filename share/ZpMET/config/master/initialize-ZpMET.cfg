# -*- mode: config -*-
# CAF initialize config for Z'+MET analysis (ANA-EXOT-2023-28)
# Modelled on share/config/master/yyML/initialize-yyML-nom.cfg

[initialize]

# -- Input/Output --------------------------------------------------------------
inputFile:  sampleFolders/prepared/samples-prepared-ZpMET.root
outputFile: sampleFolders/initialized/samples-initialized-ZpMET.root

# -- Per-campaign ntuple locations ---------------------------------------------
# campaignsConfig must point to a file with one [campaign] section each,
# containing mcFileList and mcFileListTreeName (and dataFileList for data).
campaignsConfig: ZpMET/config/master/ZpMET-campaigns.cfg
campaigns:       mc23e

# -- Normalization -------------------------------------------------------------
normalize:                     true
initializer.useCountHistogram: true

# -- Pre-initialize patches ----------------------------------------------------
# Sets usemcweights=true (required by TQSampleInitializerBase to enter
# the bookkeeping branch) and per-sample count histogram names/bins.
preInit_patches: ZpMET/config/patches/ZpMET-preinit-patch.txt

# -- Debugging -----------------------------------------------------------------
printSamplesFailed: true
verbose:            true

# -- Channels ------------------------------------------------------------------
channels:           ee, mm
channelPlaceholder: channel
