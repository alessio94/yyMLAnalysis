# -*- mode: config -*-
# CAF visualize config for Z'+MET analysis (ANA-EXOT-2023-28)

[visualize]

# ── Input/Output ──────────────────────────────────────────────────────────────
inputFile:   sampleFolders/analyzed/samples-analyzed-ZpMET.root
outputFile:  sampleFolders/visualized/samples-visualized-ZpMET.root
outputDir:   results/ZpMET

# ── Style ─────────────────────────────────────────────────────────────────────
patches:  ZpMET/config/visualization/style/ZpMET-style.txt

# ── Plots ─────────────────────────────────────────────────────────────────────
makePlots:           CutInitial/met CutInitial/met_phi CutEEMET/met CutEEMET/met_phi CutEEMET/el_pt_lead CutEEMET/el_pt_sublead CutEEMET/el_eta_lead CutEEMET/el_phi_lead CutEEMET/mll_ee CutMMMET/met CutMMMET/met_phi CutMMMET/mu_pt_lead CutMMMET/mu_pt_sublead CutMMMET/mu_eta_lead CutMMMET/mu_phi_lead CutMMMET/mll_mm
histogramProcesses:  ZpMET/config/visualization/processes/ZpMET-plot-processes.txt
makeLogPlots:        true
plotlabel:           "Z' -> ll + MET"
plotFormats:         pdf png

# ── Cutflows ──────────────────────────────────────────────────────────────────
makeCutflows:        true
cutflowFormats:      txt tex html
cutflowProcessFiles: ZpMET/config/visualization/processes/ZpMET-cutflow-processes.txt
cutflowCutFiles:     ZpMET/config/visualization/cuts/ZpMET-cutflow-cuts.txt

# ── ATLAS plotter settings ────────────────────────────────────────────────────
plotter.labels.atlas:              Internal
plotter.labels.lumi:               109.4
plotter.labels.lumiUnit:           fb^{-1}
luminosity:                        109400
luminosityUnit:                    pb
plotter.blocks.x.0:                1
plotter.blocks.y.0:                0.75
plotter.geometry.main.xAxis.titleOffset: 1.3
plotter.geometry.main.yAxis.titleOffset: 1.7

# ── Channels ──────────────────────────────────────────────────────────────────
channels:            ee mm
channelPlaceholder:  channel
channelConfig:       ZpMET/config/channels/ZpMET-channels.txt
