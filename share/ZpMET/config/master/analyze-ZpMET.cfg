# -*- mode: config -*-
# CAF analyze config for Z'+MET analysis (ANA-EXOT-2023-28)

[analyze]

# ── Input/Output ──────────────────────────────────────────────────────────────
inputFile:   sampleFolders/initialized/samples-initialized-ZpMET.root
outputFile:  sampleFolders/analyzed/samples-analyzed-ZpMET.root

# ── Event selection (cuts) ────────────────────────────────────────────────────
