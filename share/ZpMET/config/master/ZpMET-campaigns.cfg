# Per-campaign ntuple file lists for Z'+MET analysis (ANA-EXOT-2023-28)
# Referenced from initialize-ZpMET.cfg as `campaignsConfig`.
# Modelled on share/config/master/common/campaigns-yyML-v1-eos.cfg
#
# Each section must match a campaign name listed in `campaigns` in the
# initialize config. File list paths are relative to share/.
# mcFileList per campaign = combined signal + background PFNs.
# The same data23 file list is shared across all three MC campaigns.

[mc23a]
#dataFileList:         ZpMET/config/samples/inputFileLists/ZpMET-dataFileList-data23.txt
#dataFileListTreeName: AnalysisMiniTree
mcFileList:           ZpMET/config/samples/inputFileLists/ZpMET-mcFileList-mc23a.txt
mcFileListTreeName:   AnalysisMiniTree

