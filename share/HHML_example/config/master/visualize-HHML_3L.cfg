# -*- mode: config -*-

[visualize]

#----------------------------------------------------------
################################ WZCR
# name of the input file
inputFile: sampleFolders/analyzed/WZCR/analyzed-HHML_3L.root
# name of the output file
outputFile: sampleFolders/visualized/WZCR/visualized-HHML_3L.root
# name of the output folder
outputDir: results/HHML/WZCR   

#----------------------------------------------------------
# Channels and campaigns to run over
channels: trilep
#,trilep
channelConfig: HHML_example/config/channels/common/channels.txt

# which campaigns to run over
visualizeCampaigns: c23a
#visualizeCampaigns: c23a, c23d
#visualizeCampaigns: c23ad
visualizeCampaignConfig: HHML_example/config/campaigns/common/campaigns.txt

#----------------------------------------------------------
# Plot histograms settings

# hist colors for processes
#patches: config/visualization/style/ggF/style-post-fit-noLines.txt
#makePlots: CutChannels/MET
#*nJets*   # all */*

patches: HHML_example/config/visualization/style/HHML-style_3L.txt
histogramProcesses: HHML_example/config/visualization/processes/HHML-plot-processes_3L.txt
#histogramPlots: config/visualization/plots/ggF/histogramPlotFiles.txt

makePlots: */*
#makePlots: *Mll01*

plotFormats: pdf
makeLogPlots: true



plotter: TQDefaultPlotter
plotter.style.drawData: true           # data true or false
plotter.style.showTotalBkg: true
plotter.labels.atlas: Work in Progress
plotter.blocks.x.0: 1
plotter.blocks.y.0: 0.65
plotter.style.showUnderflow: true
plotter.style.showOverflow: true
plotter.style.subPlot: ratio

plotter.geometry.legend.xMin: 0.65
plotter.geometry.legend.xMax: 0.93
#plotter.geometry.legend.yMin: 0.72
#plotter.geometry.legend.yMax: 0.92

plotter.geometry.main.yAxis.titleOffset: 1.2
plotter.geometry.sub.xAxis.titleOffset: 3.2
plotter.geometry.sub.yAxis.titleOffset: 1.
plotter.geometry.sub.height: 0.35

plotter.geometry.sub.xAxis.labelSize: 0.03
plotter.geometry.sub.yAxis.labelSize: 0.05

plotter.geometry.sub.yAxis.titleSize: 0.05
plotter.geometry.sub.xAxis.titleSize: 0.035

plotter.style.ratio.numerator.title: Data
plotter.style.ratio.denominator.title: SM


plotter.style.legend.textSize: 0.025

# WZCR
plotlabel: "WZ Control Region (2022)"

plotter.labels.totalStack: Total Bkg
plotter.labels.atlas.scale: 1.15

