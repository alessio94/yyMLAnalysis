#------------------------------
# summary file
summaryLinearOnly: true
#summaryCuts: CutChannels, CutLepSelection, CutJetSelection
summaryCuts: CutChannels, CutLeptons

# Add systematic Band, you need to make the sys band for each channel, em, me df
# systematics: auxData/systematicsBands/ggF/systematics_em_2407.root:systematics>>::em, auxData/systematicsBands/ggF/systematics_me_2407.root:systematics>>::me, auxData/systematicsBands/ggF/systematics_2407.root:systematics>>::df

#----------------------------------------------------------
# Make cutflows

makeCutflows: true
cutflowFormats: txt, tex, html
cutflowProcessFiles: HHML_example/config/visualization/processes/HHML-cutflow-processes_3L.txt

# cutflow WZCR
cutflowCutFiles: HHML_example/config/visualization/cuts/WZCR_cutflow-HHML_3L.txt

#----------------------------------------------------------
# Background normalisation in CAF
plotter.labels.drawNFInfo: true
doNFs: false

# the campaign you want to use for deriving the NFs
# nfCampaign: run2
NF.toySize: 1


