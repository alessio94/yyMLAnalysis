[analyze]

# Unblind
aliases.skipBlinding: true

# Do blind
# aliases.skipBlinding: false

aliases.usePLIV : false

aliases.doZjetsSplit: false

aliases.skipElID: false

aliases.CutDRll01Zenri: 2000.0
aliases.CutMETZenri: 30000.0
aliases.CutMllminZenri: 12000.

aliases.CutMllMAXZenri: 200000000.
aliases.CutMllMAX:  200000.
aliases.Zwin: 25000.
aliases.ZwinMlll: 15000.
aliases.WZwin: 10000.

aliases.FFweight_Zenri: "[FakeFactorWeight_Zenri]"
# aliases.FFweight_Zdefi: "[FakeFactorWeight_default]"
aliases.FFweight_Zdefi: "[FakeFactorWeight_Zdefi]"

###########################
########    Event    ######

aliases.01IsSF: (Event$(cand)[0].part(0).type() == Event$(cand)[0].part(1).type())
aliases.02IsSF: (Event$(cand)[0].part(0).type() == Event$(cand)[0].part(2).type())
aliases.mZ: 91187.6

aliases.isZenri: ($(01IsSF) || $(02IsSF))
aliases.isZdefi: !$(isZenri)

aliases.isEEE: ((Event$(cand)[0].part(0).type() + Event$(cand)[0].part(1).type() + Event$(cand)[0].part(2).type()) == 18)
aliases.isEEM: ((Event$(cand)[0].part(0).type() + Event$(cand)[0].part(1).type() + Event$(cand)[0].part(2).type()) == 20)
aliases.isEMM: ((Event$(cand)[0].part(0).type() + Event$(cand)[0].part(1).type() + Event$(cand)[0].part(2).type()) == 22)
aliases.isMMM: ((Event$(cand)[0].part(0).type() + Event$(cand)[0].part(1).type() + Event$(cand)[0].part(2).type()) == 24)

#aliases.muonIsoWeight:     "[muonIsoWeight] * [muonIsoWeightOTF]"
aliases.electronIsoWeight: "[electronIsoWeight] * [electronIsoWeightOTF]"
### Muon iso weights in v22 are outdated, so always want to recompute them
aliases.muonIsoWeight:     "[muonIsoWeightOTF]"
#aliases.electronIsoWeight: "[electronIsoWeight]"
aliases.recoWeight:        "$(muonIsoWeight) * [muonTTVAWeight] * [muonRecoWeight] * $(electronIsoWeight) * [electronRecoWeight] * [electronIDWeight] * [jvtWeight] * [forwardJVTWeight] * [prwWeight] * [ttbarNNLOWeight]"
aliases.mcWeight:          "[mcWeight]"
aliases.eventWeight:       "$(mcWeight) * $(recoWeight)"

aliases.fitsChannel: @Event$(cand).size() > 0
###############################
########    Candidate    ######

aliases.l0: Event$(cand)[0].part(0)
aliases.l1: Event$(cand)[0].part(1)
aliases.l2: Event$(cand)[0].part(2)

aliases.j0: Event$(cand)[0].part(3)
aliases.j1: Event$(cand)[0].part(4)
aliases.j2: Event$(cand)[0].part(5)


# Mu
aliases.mu:  [SGAuxFDec:EventInfo:averageInteractionsPerCrossing]
aliases.mu_corrected:  [SGAuxFDec:EventInfo:corrected_averageInteractionsPerCrossing]



####################################
#######    Truth Candidate    ######

aliases.l0_truth: Event$(cand)[0].truthPart(0)
aliases.l1_truth: Event$(cand)[0].truthPart(1)
aliases.l2_truth: Event$(cand)[0].truthPart(2)

##############################
########    Counters    ######

aliases.nLeps: Event$(cand)[0].nLeptons()
aliases.nJets: Event$(cand)[0].nJets()

aliases.nJets2020_HHML = "[nJets2020]"
aliases.nJets4040_HHML = "[nJets4040]"
aliases.nJets2525 = "[nJets2525]"
aliases.nJets2525_FJVT_HHML = "[nJets2525_FJVT]"
aliases.nJets2525_FJVT_T_HHML = "[nJets2525_FJVT_T]"
aliases.nJets2525_31_HHML = "[nJets2525_31]"
aliases.nJets3030_HHML = "[nJets3030]"

aliases.nBJetsDL1dv01 = "[nBJetsDL1dv01]"
aliases.nBJetsSubDL1dv01 = "[nBJetsSubDL1dv01]"
aliases.nBJetsDL1dv01_WP70 = "[nBJetsDL1dv01_WP70]"
aliases.nBJetsSubDL1dv01_WP70 = "[nBJetsSubDL1dv01_WP70]"


aliases.JetCleaning: [CPCD:Event$(cand)[0]:PassLooseJetEventCleaning]

############### Taus
aliases.nTaus: @HWWTaus.size()
aliases.tau0_pt: HWWTaus[0].pt() 

aliases.nBJets_noCuts: @BTagging_AntiKt4EMPFlow.size()

##############################
########    Jets    ######

aliases.jet0_passJVT: [CPCD:Event$(cand)[0].part(3):passJVT]
aliases.jet1_passJVT: [CPCD:Event$(cand)[0].part(4):passJVT]
aliases.jet2_passJVT: [CPCD:Event$(cand)[0].part(5):passJVT]

#######################################
########    Lepton quantities    ######

# Leptons
aliases.lep0_is_e: "[$(l0).type() == 6]"
aliases.lep0_is_m: "[$(l0).type() == 8]"
aliases.lep0_pt:   "[$(l0).pt()]"
aliases.lep0_eta:  "[$(l0).eta()]"
aliases.lep1_is_e: "[$(l1).type() == 6]"
aliases.lep1_is_m: "[$(l1).type() == 8]"
aliases.lep1_pt:   "[$(l1).pt()]"
aliases.lep1_eta:  "[$(l1).eta()]"
aliases.lep2_is_e: "[$(l2).type() == 6]"
aliases.lep2_is_m: "[$(l2).type() == 8]"
aliases.lep2_pt:   "[$(l2).pt()]"
aliases.lep2_eta:  "[$(l2).eta()]"


aliases.Mlll: ((((Event$(cand)[0].p4(0,1,2))))).M()
aliases.Mll01:((((Event$(cand)[0].p4(0,1))))).M()
aliases.Mll02:((((Event$(cand)[0].p4(0,2))))).M()
aliases.Mll12:((((Event$(cand)[0].p4(1,2))))).M()

aliases.Mllmin: "(((Event$(cand)[0].p4(0,1))).M()) < (((Event$(cand)[0].p4(0,2))).M()) ? (((Event$(cand)[0].p4(0,1))).M()) :(((Event$(cand)[0].p4(0,2))).M())"
aliases.MllMAX: "(((Event$(cand)[0].p4(0,1))).M()) > (((Event$(cand)[0].p4(0,2))).M()) ? (((Event$(cand)[0].p4(0,1))).M()) :(((Event$(cand)[0].p4(0,2))).M())"

aliases.DPhiMETl0: "acos( cos( fabs( Event$(cand)[0].missingET().phi() - Event$(cand)[0].part(0).phi() ) ) )"
aliases.DPhiMETl1: "acos( cos( fabs( Event$(cand)[0].missingET().phi() - Event$(cand)[0].part(1).phi() ) ) )"
aliases.DPhiMETl2: "acos( cos( fabs( Event$(cand)[0].missingET().phi() - Event$(cand)[0].part(2).phi() ) ) )"

aliases.minDPhiMETl: "( ($(DPhiMETl0) < $(DPhiMETl1) && $(DPhiMETl0) < $(DPhiMETl1)) ? $(DPhiMETl0) : ( ($(DPhiMETl1) < $(DPhiMETl2)) ? $(DPhiMETl1) : $(DPhiMETl2)) )"


aliases.DPhill01: "acos( cos( fabs( Event$(cand)[0].part(0).phi() - Event$(cand)[0].part(1).phi() ) ) )"
aliases.DPhill02: "acos( cos( fabs( Event$(cand)[0].part(0).phi() - Event$(cand)[0].part(2).phi() ) ) )"
aliases.DPhill12: "acos( cos( fabs( Event$(cand)[0].part(1).phi() - Event$(cand)[0].part(2).phi() ) ) )"
aliases.DEtall01: fabs(Event$(cand)[0].part(0).eta() - Event$(cand)[0].part(1).eta())
aliases.DEtall02: fabs(Event$(cand)[0].part(0).eta() - Event$(cand)[0].part(2).eta())
aliases.DEtall12: fabs(Event$(cand)[0].part(1).eta() - Event$(cand)[0].part(2).eta())


aliases.DPhilj01: "acos( cos( fabs( Event$(cand)[0].part(0).phi() - Event$(cand)[0].part(3).phi() ) ) )"
aliases.DPhilj02: "acos( cos( fabs( Event$(cand)[0].part(0).phi() - Event$(cand)[0].part(4).phi() ) ) )"
aliases.DPhilj11: "acos( cos( fabs( Event$(cand)[0].part(1).phi() - Event$(cand)[0].part(3).phi() ) ) )"
aliases.DPhilj12: "acos( cos( fabs( Event$(cand)[0].part(1).phi() - Event$(cand)[0].part(4).phi() ) ) )"
aliases.DPhilj21: "acos( cos( fabs( Event$(cand)[0].part(2).phi() - Event$(cand)[0].part(3).phi() ) ) )"
aliases.DPhilj22: "acos( cos( fabs( Event$(cand)[0].part(2).phi() - Event$(cand)[0].part(4).phi() ) ) )"

aliases.DEtalj01: fabs(Event$(cand)[0].part(0).eta() - Event$(cand)[0].part(3).eta())
aliases.DEtalj02: fabs(Event$(cand)[0].part(0).eta() - Event$(cand)[0].part(4).eta())
aliases.DEtalj11: fabs(Event$(cand)[0].part(1).eta() - Event$(cand)[0].part(3).eta())
aliases.DEtalj12: fabs(Event$(cand)[0].part(1).eta() - Event$(cand)[0].part(4).eta())
aliases.DEtalj21: fabs(Event$(cand)[0].part(2).eta() - Event$(cand)[0].part(3).eta())
aliases.DEtalj22: fabs(Event$(cand)[0].part(2).eta() - Event$(cand)[0].part(4).eta())

aliases.DRlj01: "sqrt( $(DEtalj01)*$(DEtalj01) + $(DPhilj01)*$(DPhilj01))"
aliases.DRlj02: "sqrt( $(DEtalj02)*$(DEtalj02) + $(DPhilj02)*$(DPhilj02))"
aliases.DRlj11: "sqrt( $(DEtalj11)*$(DEtalj11) + $(DPhilj11)*$(DPhilj11))"
aliases.DRlj12: "sqrt( $(DEtalj12)*$(DEtalj12) + $(DPhilj12)*$(DPhilj12))"
aliases.DRlj21: "sqrt( $(DEtalj21)*$(DEtalj21) + $(DPhilj21)*$(DPhilj21))"
aliases.DRlj22: "sqrt( $(DEtalj22)*$(DEtalj22) + $(DPhilj22)*$(DPhilj22))"


aliases.minDRl0j: "[(($DRlj01) < $(DRlj02)) ? $(DRlj01) : $(DRlj02)]"
aliases.minDRl1j: "[(($DRlj11) < $(DRlj12)) ? $(DRlj11) : $(DRlj12)]"
aliases.minDRl2j: "[(($DRlj21) < $(DRlj22)) ? $(DRlj21) : $(DRlj22)]"

aliases.minDRlj: "( ($(minDRl0j) < $(minDRl1j) && $(minDRl0j) < $(minDRl2j)) ? $(minDRl0j) : ( ($(minDRl1j) < $(minDRl2j)) ? $(minDRl1j) : $(minDRl2j)) )"

aliases.DRll01: "sqrt( $(DEtall01)*$(DEtall01) + $(DPhill01)*$(DPhill01))"
aliases.DRll02: "sqrt( $(DEtall02)*$(DEtall02) + $(DPhill02)*$(DPhill02))"
aliases.DRll12: "sqrt( $(DEtall12)*$(DEtall12) + $(DPhill12)*$(DPhill12))"

aliases.DPhill01MET: acos( cos( fabs( ((Event$(cand)[0].p4(0,1))).Phi() - Event$(cand)[0].missingET().phi() ) ) )
aliases.DPhill02MET: acos( cos( fabs( ((Event$(cand)[0].p4(0,2))).Phi() - Event$(cand)[0].missingET().phi() ) ) )
aliases.DPhill12MET: acos( cos( fabs( ((Event$(cand)[0].p4(1,2))).Phi() - Event$(cand)[0].missingET().phi() ) ) )

aliases.DPhill01TrackMET: acos( cos( fabs( ((Event$(cand)[0].p4(0,1))).Phi() - HWWTrackMET$(p4suffix)[0].phi() ) ) )
aliases.DPhill02TrackMET: acos( cos( fabs( ((Event$(cand)[0].p4(0,2))).Phi() - HWWTrackMET$(p4suffix)[0].phi() ) ) )
aliases.DPhill12TrackMET: acos( cos( fabs( ((Event$(cand)[0].p4(1,2))).Phi() - HWWTrackMET$(p4suffix)[0].phi() ) ) )

//aliases.Mlll: ((((Event$(cand)[0].p4(0,1,2))))).M()
aliases.lepPtSum: ((((Event$(cand)[0].p4(0,1,2))))).Pt()
aliases.lepPtSum_flat: "[Event$(cand)[0].part(0).pt() + Event$(cand)[0].part(1).pt() + Event$(cand)[0].part(2).pt()]"
aliases.mWT: [WHMT]

aliases.truthOrigin0: "(  [Event$(cand)[0].part(0).type()] == 8 ? [CPID:Event$(cand)[0].part(0):hwwTruthOrigin] : [CPID:Event$(cand)[0].part(0):truthOrigin])"
aliases.truthOrigin1: "(  [Event$(cand)[0].part(1).type()] == 8 ? [CPID:Event$(cand)[0].part(1):hwwTruthOrigin] : [CPID:Event$(cand)[0].part(1):truthOrigin])"
aliases.truthOrigin2: "(  [Event$(cand)[0].part(2).type()] == 8 ? [CPID:Event$(cand)[0].part(2):hwwTruthOrigin] : [CPID:Event$(cand)[0].part(2):truthOrigin])"

aliases.truthType0: "(  [Event$(cand)[0].part(0).type()] == 8 ? [CPID:Event$(cand)[0].part(0):hwwTruthType] : [CPID:Event$(cand)[0].part(0):truthType])"
aliases.truthType1: "(  [Event$(cand)[0].part(1).type()] == 8 ? [CPID:Event$(cand)[0].part(1):hwwTruthType] : [CPID:Event$(cand)[0].part(1):truthType])"
aliases.truthType2: "(  [Event$(cand)[0].part(2).type()] == 8 ? [CPID:Event$(cand)[0].part(2):hwwTruthType] : [CPID:Event$(cand)[0].part(2):truthType])"

aliases.l0charge: [CPFD:Event$(cand)[0].part(0):charge]
aliases.l1charge: [CPFD:Event$(cand)[0].part(1):charge]
aliases.l2charge: [CPFD:Event$(cand)[0].part(2):charge]

aliases.sumOfCharges: $(l0charge)+$(l1charge)+$(l2charge)


aliases.lep0_author: [CPUSD:Event$(cand)[0].part(0):author]
aliases.lep1_author: [CPUSD:Event$(cand)[0].part(1):author]
aliases.lep2_author: [CPUSD:Event$(cand)[0].part(2):author]

aliases.lep_q0xq1: $(l0charge)*$(l1charge)
aliases.lep_q0xq2: $(l0charge)*$(l2charge)
aliases.lep_q1xq2: $(l1charge)*$(l2charge)


aliases.lep0ElECIDS:[CPCD:Event$(cand)[0].part(0):DFCommonElectronsECIDS]
aliases.lep1ElECIDS:[CPCD:Event$(cand)[0].part(1):DFCommonElectronsECIDS]
aliases.lep2ElECIDS:[CPCD:Event$(cand)[0].part(2):DFCommonElectronsECIDS]

aliases.lep0ElIDLHLoose:[CPCD:Event$(cand)[0].part(0):isLHLoose]
aliases.lep1ElIDLHLoose:[CPCD:Event$(cand)[0].part(1):isLHLoose]
aliases.lep2ElIDLHLoose:[CPCD:Event$(cand)[0].part(2):isLHLoose]
aliases.lep0ElIDLHMedium:[CPCD:Event$(cand)[0].part(0):isLHMedium]
aliases.lep1ElIDLHMedium:[CPCD:Event$(cand)[0].part(1):isLHMedium]
aliases.lep2ElIDLHMedium:[CPCD:Event$(cand)[0].part(2):isLHMedium]
aliases.lep0ElIDLHTight:[CPCD:Event$(cand)[0].part(0):isLHTight]
aliases.lep1ElIDLHTight:[CPCD:Event$(cand)[0].part(1):isLHTight]
aliases.lep2ElIDLHTight:[CPCD:Event$(cand)[0].part(2):isLHTight]

aliases.lep0MuQuality:[CPID:Event$(cand)[0].part(0):Quality]
aliases.lep1MuQuality:[CPID:Event$(cand)[0].part(1):Quality]
aliases.lep2MuQuality:[CPID:Event$(cand)[0].part(2):Quality]

aliases.lep0_d0sig: [CPFD:Event$(cand)[0].part(0):d0sig]
aliases.lep1_d0sig: [CPFD:Event$(cand)[0].part(1):d0sig]
aliases.lep2_d0sig: [CPFD:Event$(cand)[0].part(2):d0sig]

aliases.lep0_qxd0sig: $(l0charge)*$(lep0_d0sig)
aliases.lep1_qxd0sig: $(l1charge)*$(lep1_d0sig)
aliases.lep2_qxd0sig: $(l2charge)*$(lep2_d0sig)

aliases.lep0_z0st: [CPFD:$(l0):z0]*[CPFD:$(l0):sinTheta]
aliases.lep1_z0st: [CPFD:$(l1):z0]*[CPFD:$(l1):sinTheta]
aliases.lep2_z0st: [CPFD:$(l2):z0]*[CPFD:$(l2):sinTheta]

aliases.lep0_z0: [CPFD:$(l0):z0]
aliases.lep1_z0: [CPFD:$(l1):z0]
aliases.lep2_z0: [CPFD:$(l2):z0]


aliases.Lep0ID: "[leadLepID]"
aliases.Lep1ID: "[subleadLepID]"
aliases.Lep2ID: "[thirdLepID]"

aliases.Lep0AntiID: "[leadLepAntiID]"
aliases.Lep1AntiID: "[subleadLepAntiID]"
aliases.Lep2AntiID: "[thirdLepAntiID]"

aliases.PLIV0 : "[PLIVTightLep0]"
aliases.PLIV1 : "[PLIVTightLep1]"
aliases.PLIV2 : "[PLIVTightLep2]"

# aliases.PLIV0 : "[PLIVVeryTightLep0]"
# aliases.PLIV1 : "[PLIVVeryTightLep1]"
# aliases.PLIV2 : "[PLIVVeryTightLep2]"

############################################
########    Fake lepton quantities    ######

aliases.lep1_is_fake:      "([FakeIndexWH3L] == 1)"
aliases.lep2_is_fake:      "([FakeIndexWH3L] == 2)"
aliases.fake_is_present:   "($(lep1_is_fake) ? [thirdLepID] : ($(lep2_is_fake) ? [subleadLepID] : 0.))"
aliases.fake_is_e:         "($(lep1_is_fake) ? $(lep1_is_e) : $(lep2_is_e))"
aliases.fake_is_m:         "($(lep1_is_fake) ? $(lep1_is_m) : $(lep2_is_m))"
aliases.fake_pt:           "($(lep1_is_fake) ? $(lep1_pt)   : $(lep2_pt))"
aliases.fake_eta:          "($(lep1_is_fake) ? $(lep1_eta)  : $(lep2_eta))"
aliases.e_fake_is_present: "($(fake_is_present) && $(fake_is_e))"
aliases.m_fake_is_present: "($(fake_is_present) && $(fake_is_m))"

#########################
#######    MET    #######

# MET
# aliases.MET: Event$(cand)[0].missingET().met()
# TST MET
aliases.MET: HWWMET$(p4suffix)[0].met()
aliases.METWH: HWWMET$(p4suffix)[0].met()
aliases.METphi: Event$(cand)[0].missingET().phi()

aliases.MET_STVF: Event$(cand)[0].missingET().met()
aliases.MET_TrackHWW_Clj: Event$(cand)[0].missingET().met()

aliases.METSig: [METSig]
#####################################
########  Charge (mis)ID ############

aliases.lep0_passChargeID: [ ( $(lep0_is_e) && $(Lep0ID) ) ? [CPCD:$(l0):DFCommonElectronsECIDS] : 1 ]
aliases.lep1_passChargeID: [ ( $(lep1_is_e) && $(Lep1ID) ) ? [CPCD:$(l1):DFCommonElectronsECIDS] : 1 ]
aliases.lep2_passChargeID: [ ( $(lep2_is_e) && $(Lep2ID) ) ? [CPCD:$(l2):DFCommonElectronsECIDS] : 1 ]
aliases.trilep_passChargeID: [ $(lep0_passChargeID) && $(lep1_passChargeID) && $(lep2_passChargeID) ]

################################
########    Isolation     ######

aliases.lep0_passIsoFCLoose:  [CPFD:Event$(cand)[0].part(0):passIsoFCLoose]

aliases.lep0_passIsoPLVTight: [CPCD:Event$(cand)[0].part(0):passIsoPLVTight]
aliases.lep1_passIsoPLVTight: [CPCD:Event$(cand)[0].part(1):passIsoPLVTight]
aliases.lep2_passIsoPLVTight: [CPCD:Event$(cand)[0].part(2):passIsoPLVTight]

aliases.lep0_passIsoPLVLoose: [CPCD:Event$(cand)[0].part(0):passIsoPLVLoose]
aliases.lep1_passIsoPLVLoose: [CPCD:Event$(cand)[0].part(1):passIsoPLVLoose]
aliases.lep2_passIsoPLVLoose: [CPCD:Event$(cand)[0].part(2):passIsoPLVLoose]


aliases.lep0_passIsoLoose_VarRad: [CPCD:Event$(cand)[0].part(0):passIsoLoose_VarRad]
aliases.lep1_passIsoLoose_VarRad: [CPCD:Event$(cand)[0].part(1):passIsoLoose_VarRad]
aliases.lep2_passIsoLoose_VarRad: [CPCD:Event$(cand)[0].part(2):passIsoLoose_VarRad]

aliases.lep0_passIsoTight_VarRad: [CPCD:Event$(cand)[0].part(0):passIsoTight_VarRad]
aliases.lep1_passIsoTight_VarRad: [CPCD:Event$(cand)[0].part(1):passIsoTight_VarRad]
aliases.lep2_passIsoTight_VarRad: [CPCD:Event$(cand)[0].part(2):passIsoTight_VarRad]

###############################
#######    MVA (Zdom)   #######

# Diboson MVA CHECK EVEN/ODD evaluation: if even event use ODD weights.xml (and vice-versa)
# aliases.MVADBEven:  "((fmod([EventIndex],2)==0) ? [weights/ODD.weights.xml] : -9999)"
# aliases.MVADBOdd: "((fmod([EventIndex],2)==1)  ? -9999 : [weights/EVEN.weights.xml])"
aliases.MVADB: "((fmod([EventIndex],2)==0) ? [auxData/MVAWeights/WH/BDTODD.weights.xml] : [auxData/MVAWeights/WH/BDTEVEN.weights.xml])"

aliases.ANN_wz : "lwtnnSeq(auxData/lwtnnModels/WH/nn_WZ_wh3l_zdom.json, {output_0, output_1})"
aliases.ANN_wz_1: [VecAT($(ANN_wz), 1)]

aliases.STXSstage1_2:      [SGAuxIDec:EventInfo:HTXS_Stage1_2_Category_pTjet30]
aliases.STXSstage1_2_Fine: [SGAuxIDec:EventInfo:HTXS_Stage1_2_Fine_Category_pTjet30]
aliases.STXS_ptv:          [SGAuxFDec:EventInfo:HTXS_V_pt]

####################
# SR3 ANN (Zdep old)
####################

aliases.dnnWZ: [lwtnn(auxData/lwtnnModels/WH/dnn_wz.json, {out_0})]
aliases.dnnttbar: [lwtnn(auxData/lwtnnModels/WH/dnn_ttbar.json, {out_0})]

aliases.dnnMulticlass_whNode: [lwtnn(auxData/lwtnnModels/WH/dnn_multiclassifier.json, {out_0})]
aliases.dnnMulticlass_wzNode: [lwtnn(auxData/lwtnnModels/WH/dnn_multiclassifier.json, {out_1})]
aliases.dnnMulticlass_ttbarNode: [lwtnn(auxData/lwtnnModels/WH/dnn_multiclassifier.json, {out_2})]
aliases.dnnMulticlass_deltaNode: "( $(dnnMulticlass_wzNode)-$(dnnMulticlass_ttbarNode) )"

aliases.SR3dnnMulticlass_mostSignificantBinFullRun2: "( $(dnnMulticlass_whNode)>=0.8698 && $(dnnMulticlass_deltaNode)>=-0.012013422818791947 && $(dnnMulticlass_deltaNode)<0.13 )"
aliases.SR3dnnMulticlass_mostSignificantBinC16a: "( $(dnnMulticlass_whNode)>=0.8149 && $(dnnMulticlass_deltaNode)>=-0.018053691275167788 && $(dnnMulticlass_deltaNode)<0.23 )"

