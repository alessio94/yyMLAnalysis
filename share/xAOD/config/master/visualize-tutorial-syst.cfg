# -*- mode: config -*-

[visualize]

#----------------------------------------------------------
# name of the input file
inputFile: sampleFolders/analyzed/samples-analyzed-tutorial-sys.root
# name of the output file
outputFile: sampleFolders/visualized/samples-visualized-tutorial-sys.root

# name of the output folder
outputDir: results/tutorial-syst

#----------------------------------------------------------
# Channels and campaigns to run over
channels: em, me, df

# which campaigns to run over
visualizeCampaigns: c16a

# assignment of systematics bands files to channels:
# systematicsBands: systband_em.root:systematics>>::em, systband_me.root:systematics>>::me, systband.root:systematics>>::df

#----------------------------------------------------------
# Background normalisation in CAF
doNFs: false

#---------------------------------------------------
# plot settings
makePlots: *
histogramProcesses: xAOD/config/visualization/processes/xAOD-Example-plot-processes-tutorial-sys.txt
plotter.labels.atlas: Tutorial

#skip cutflows (not properly configured for this tutorial)
makeCutflows: false


# configure plotter for nice plots
plotter: TQDefaultPlotter
plotter.blocks.x.0: 1
plotter.blocks.y.0: 0.7
optScan.enlargeY : 0.8
