aliases.DPhillMETtrk: "acos( cos ( fabs( (( ((Event$(cand)[0].p4(0,1))).Phi() ) - (  HWWTrackMET$(p4suffix)[0].phi() )) ) ) )"
# The following mt computations implicitly use https://gitlab.cern.ch/atlas/athena/-/blob/21.2/Event/xAOD/xAODParticleEvent/Root/CompositeParticle_v1.cxx#L322-366
