[analyze]

# CutChannels
aliases.fitsChannel: @Event$(cand).size() > 0

# Lepton pT
aliases.lep0:     Event$(cand)[0].part(0)
aliases.lep1:     Event$(cand)[0].part(1)
aliases.otherPart0: Event$(cand)[0].otherPart(0)

#######################################
###       DNN nTuple variables      ###
#######################################
### truth level variables
aliases.STXSstage1_2:        [SGAuxIDec:EventInfo:HTXS_Stage1_2_Fine_Category_pTjet30]
aliases.pT_H_truth:          [SGAuxFDec:EventInfo:HTXS_Higgs_decay_pt]
aliases.Eta_H_truth:	     [SGAuxFDec:EventInfo:HTXS_Higgs_decay_eta]
aliases.Phi_H_truth:         [SGAuxFDec:EventInfo:HTXS_Higgs_decay_phi]

### reco level variables
aliases.Eta_H:		 "(((((Event$(cand)[0].p4(-1,0,1)))))).Eta()"
aliases.MET_phi:	 Event$(cand)[0].missingET().phi()
aliases.bTagWeightOTF20: [bTagWeightOTF20]
aliases.nBJetsSubDL1r:   [nBJetsSubDL1r]
aliases.Mtt:             "{ [mtt] == -9.0 ? -1000.0 : [mtt] }"

aliases.lep0_F: "$(lep0_is_e) ? -1. : {$(lep0_is_m) ? 1. : 0.}"
aliases.lep1_F: "$(lep1_is_e) ? -1. : {$(lep1_is_m) ? 1. : 0.}"
aliases.QBar: "( ([$(lep0).pt()] - [$(lep1).pt()]) / ([$(lep0).pt()]+[$(lep1).pt()]) ) * double($(l0charge))"
aliases.FBar: "( ([$(lep0).pt()] - [$(lep1).pt()]) / ([$(lep0).pt()]+[$(lep1).pt()]) ) * double($(lep0_F))"

#############################################
###   Transformed reco. level variables   ###
#############################################
##Phi
aliases.lep0_phi_trans: "0."
aliases.lep1_phi_rotate: "{ $(lep1).phi()-$(lep0).phi() < -1. * TMath::Pi() ? $(lep1).phi()-$(lep0).phi() + 2. * TMath::Pi() : {$(lep1).phi()-$(lep0).phi() >= TMath::Pi() ? $(lep1).phi()-$(lep0).phi() - 2. * TMath::Pi() : $(lep1).phi()-$(lep0).phi()} }"
aliases.jet0_phi_rotate: "{ $(jet0).phi()-$(lep0).phi() < -1. * TMath::Pi() ? $(jet0).phi()-$(lep0).phi() + 2. * TMath::Pi() : {$(jet0).phi()-$(lep0).phi() >= TMath::Pi() ? $(jet0).phi()-$(lep0).phi() - 2. * TMath::Pi() : $(jet0).phi()-$(lep0).phi()} }"
aliases.MET_phi_rotate: "{ $(MET_phi)-$(lep0).phi() < -1. * TMath::Pi() ? $(MET_phi)-$(lep0).phi() + 2. * TMath::Pi() : {$(MET_phi)-$(lep0).phi() >= TMath::Pi() ? $(MET_phi)-$(lep0).phi() - 2. * TMath::Pi() : $(MET_phi)-$(lep0).phi()} }"
aliases.Phi_H_rotate: "{ $(Phi_H)-$(lep0).phi() < -1. * TMath::Pi() ? $(Phi_H)-$(lep0).phi() + 2. * TMath::Pi() : {$(Phi_H)-$(lep0).phi() >= TMath::Pi() ? $(Phi_H)-$(lep0).phi() - 2. * TMath::Pi() : $(Phi_H)-$(lep0).phi()} }"

aliases.lep1_phi_trans:  "$(lep1_phi_rotate)>=0.   ? $(lep1_phi_rotate)    : -1. * $(lep1_phi_rotate)"
aliases.jet0_phi_trans:  "$(lep1_phi_rotate)>=0.   ? $(jet0_phi_rotate)    : -1. * $(jet0_phi_rotate)"
aliases.MET_phi_trans: 	 "$(lep1_phi_rotate)>=0.   ? $(MET_phi_rotate)     : -1. * $(MET_phi_rotate)"
aliases.Phi_H_trans:     "$(lep1_phi_rotate)>=0.   ? $(Phi_H_rotate)       : -1. * $(Phi_H_rotate)"

##Eta
aliases.lep0_eta_trans:	 "$(lep0).eta()>=0.   ? $(lep0).eta() : -1. * $(lep0).eta()"
aliases.lep1_eta_trans:  "$(lep0).eta()>=0.   ? $(lep1).eta() : -1. * $(lep1).eta()"
aliases.jet0_eta_trans:  "$(lep0).eta()>=0.   ? $(jet0).eta() : -1. * $(jet0).eta()"

#######################################
###           DNN models	    ###
#######################################
#4-fold 0-jet ggF binary classifier
# aliases.DNNoutput_0jet_0: "((fmod([EventInfo.eventNumber()],4)==2) ? [lwtnnSeq(auxData/lwtnnModels/ggF/0jet_binary_0.json, {ggF})] : 0.0 )"
# aliases.DNNoutput_0jet_1: "((fmod([EventInfo.eventNumber()],4)==1) ? [lwtnnSeq(auxData/lwtnnModels/ggF/0jet_binary_1.json, {ggF})] : 0.0 )"
# aliases.DNNoutput_0jet_2: "((fmod([EventInfo.eventNumber()],4)==0) ? [lwtnnSeq(auxData/lwtnnModels/ggF/0jet_binary_2.json, {ggF})] : 0.0 )"
# aliases.DNNoutput_0jet_3: "((fmod([EventInfo.eventNumber()],4)==3) ? [lwtnnSeq(auxData/lwtnnModels/ggF/0jet_binary_3.json, {ggF})] : 0.0 )"
# aliases.DNNoutput_0jet:   "($(DNNoutput_0jet_0)+$(DNNoutput_0jet_1)+$(DNNoutput_0jet_2)+$(DNNoutput_0jet_3))"

#4-fold 1-jet ggF/VBF multiClassifier
aliases.DNNoutput_1jetVector_0: "((fmod([EventInfo.eventNumber()],4)==2) ? [lwtnnSeq(xAOD/auxData/MVAWeights/1jet_multiClass_ggF_VBF_0.json, {ggF,VBF,bkg})] : 0.0 )"
aliases.DNNoutput_1jetVector_1: "((fmod([EventInfo.eventNumber()],4)==1) ? [lwtnnSeq(xAOD/auxData/MVAWeights/1jet_multiClass_ggF_VBF_1.json, {ggF,VBF,bkg})] : 0.0 )"
aliases.DNNoutput_1jetVector_2: "((fmod([EventInfo.eventNumber()],4)==0) ? [lwtnnSeq(xAOD/auxData/MVAWeights/1jet_multiClass_ggF_VBF_2.json, {ggF,VBF,bkg})] : 0.0 )"
aliases.DNNoutput_1jetVector_3: "((fmod([EventInfo.eventNumber()],4)==3) ? [lwtnnSeq(xAOD/auxData/MVAWeights/1jet_multiClass_ggF_VBF_3.json, {ggF,VBF,bkg})] : 0.0 )"
aliases.DNNoutput_1jetVector: 	"($(DNNoutput_1jetVector_0)+$(DNNoutput_1jetVector_1)+$(DNNoutput_1jetVector_2)+$(DNNoutput_1jetVector_3))"

aliases.DNNoutput_1jet:        "[VecAT($(DNNoutput_1jetVector), 0)]"
aliases.DNNoutput_VBF_1jet:    "[VecAT($(DNNoutput_1jetVector), 1)]"
aliases.DNNoutput_bkg_1jet:    "[VecAT($(DNNoutput_1jetVector), 2)]"

#######################################
###           DNN blinding	    ###
#######################################
##Caution: Not tested yet

#0jet = (50,50)Q
aliases.0jet_DNN_blinding_0_10: "[$(DNNoutput_0jet) < 0.62]"
aliases.0jet_DNN_blinding_GT10: "[$(DNNoutput_0jet) < 0.63]"

#1jet ggF (50,50,50,33.3,33.3)Q
#1jet VBF (0,0,0,0,0)Q
aliases.1jet_DNN_blinding_000_060: "[$(DNNoutput_1jet)<0.63] && [$(DNNoutput_VBF_1jet)<0.081]"
aliases.1jet_DNN_blinding_060_120: "[$(DNNoutput_1jet)<0.56] && [$(DNNoutput_VBF_1jet)<0.205]"
aliases.1jet_DNN_blinding_120_200: "[$(DNNoutput_1jet)<0.57] && [$(DNNoutput_VBF_1jet)<0.277]"
aliases.1jet_DNN_blinding_200_300: "[$(DNNoutput_1jet)<0.49] && [$(DNNoutput_VBF_1jet)<0.280]"
aliases.1jet_DNN_blinding_GT300:   "[$(DNNoutput_1jet)<0.49] && [$(DNNoutput_VBF_1jet)<0.280]"
aliases.1jet_DNN_blinding_GT120:   "[$(DNNoutput_1jet)<0.49] && [$(DNNoutput_VBF_1jet)<0.277]"
aliases.1jet_DNN_blinding:         "[$(1jet_DNN_blinding_000_060)] || [$(1jet_DNN_blinding_060_120)] || [$(1jet_DNN_blinding_120_200)] || [$(1jet_DNN_blinding_200_300)] || [$(1jet_DNN_blinding_GT300)]"

