aliases.MTlep0: Event$(cand)[0].mt(0)
aliases.MTlep1: Event$(cand)[0].mt(1)
aliases.pt_llTrackMET: [VecAT([p4_llTrackMET], 0)]

################################
########   Jets  alias    ######
aliases.pTj1: "((Event$(cand)[0].p4(2))).Pt()"
aliases.DYjj: "fabs(Event$(cand)[0].part(2).rapidity() - Event$(cand)[0].part(3).rapidity())"
aliases.SEtajj:  "Event$(cand)[0].part(2).eta() + Event$(cand)[0].part(3).eta()"
aliases.DEtajj: "fabs(Event$(cand)[0].part(2).eta() - Event$(cand)[0].part(3).eta())"
aliases.DPhijj: "acos( cos( fabs( Event$(cand)[0].part(2).phi() - Event$(cand)[0].part(3).phi() ) ) )"
aliases.DRjj: "sqrt(pow($(DPhijj), 2) + pow($(DEtajj), 2))"
aliases.DPhijj_sign: "fmod(((Event$(cand)[0].part(2).eta())  >  (Event$(cand)[0].part(3).eta())) * (Event$(cand)[0].part(2).phi() - Event$(cand)[0].part(3).phi())  +  ((Event$(cand)[0].part(3).eta())  > (Event$(cand)[0].part(2).eta())) * (Event$(cand)[0].part(3).phi() - Event$(cand)[0].part(2).phi()) + 2 * TMath::Pi(),2*TMath::Pi())"
aliases.RatioYHDYjj:      Event$(cand)[0].rapidity()/(fabs(Event$(cand)[0].part(2).rapidity() - Event$(cand)[0].part(3).rapidity()))
aliases.RatioYHDYll:      Event$(cand)[0].rapidity()/(fabs(Event$(cand)[0].part(0).rapidity() - Event$(cand)[0].part(1).rapidity()))
aliases.RatioEtaHDEtajj:  Event$(cand)[0].eta()/(fabs(Event$(cand)[0].part(2).eta() - Event$(cand)[0].part(3).eta()))
aliases.RatioEtallDEtajj: ( ((Event$(cand)[0].p4(0,1))).Eta() )/(fabs(Event$(cand)[0].part(2).eta() - Event$(cand)[0].part(3).eta()))
aliases.RatioEtaHDEtall:  Event$(cand)[0].eta()/(fabs(Event$(cand)[0].part(0).eta() - Event$(cand)[0].part(1).eta()))

aliases.RatioYHStarDYjj:      (Event$(cand)[0].rapidity() - (Event$(cand)[0].part(2).rapidity()+Event$(cand)[0].part(3).rapidity())/2)/(fabs(Event$(cand)[0].part(2).rapidity() - Event$(cand)[0].part(3).rapidity()))
aliases.RatioEtaHStarDEtajj:  (Event$(cand)[0].eta()  - (Event$(cand)[0].part(2).eta()+Event$(cand)[0].part(3).eta())/2)/(fabs(Event$(cand)[0].part(2).eta() - Event$(cand)[0].part(3).eta()))
