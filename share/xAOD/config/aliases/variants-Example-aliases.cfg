aliases.MET_CST: HWWMET$(p4suffix)[1].met()
aliases.TrackMET: HWWTrackMET$(p4suffix)[0].met()
aliases.DPhiMETs: "acos( cos ( fabs( (( HWWMET$(p4suffix)[1].phi() ) - ( Event$(cand)[0].missingET().phi() )) ) ) )"
aliases.DPhiTSTtrk: "acos( cos ( fabs( (( HWWTrackMET$(p4suffix)[0].phi() ) - ( Event$(cand)[0].missingET().phi() )) ) ) )"
aliases.DPhiCSTtrk: "acos( cos ( fabs( (( HWWTrackMET$(p4suffix)[0].phi() ) - ((  HWWMET$(p4suffix)[1].phi() )) ) ) ) )"
aliases.sqrtHT: sqrt([HT]/1000.)
aliases.METSig_evt: [$(MET)/1000.]/[$(sqrtHT)]
aliases.METSig: [METSig]
