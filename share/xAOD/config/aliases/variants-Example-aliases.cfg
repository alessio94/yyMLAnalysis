#####################################
########  di-lepton quantities ######
aliases.dilepCharge: Event$(cand)[0].charge()
aliases.Mll: "((Event$(cand)[0].p4(0,1))).M()"
aliases.Ptll: "((Event$(cand)[0].p4(0,1))).Pt()"
aliases.DPhill: "acos( cos( fabs( Event$(cand)[0].part(0).phi() - Event$(cand)[0].part(1).phi() ) ) )"
aliases.DEtall: "fabs(Event$(cand)[0].part(0).eta() - Event$(cand)[0].part(1).eta())"
aliases.costhetastar: "fabs(tanh( (Event$(cand)[0].part(0).eta() - Event$(cand)[0].part(1).eta() ) / 2))"


aliases.DRll: "sqrt(pow($(DPhill), 2) + pow($(DEtall), 2))"
aliases.DYll: "fabs(Event$(cand)[0].part(0).rapidity() - Event$(cand)[0].part(1).rapidity())"

aliases.TruthMllvv: { $(dsid) == 364285 ? ( fabs(([Mllvv]/1000.) - 126.) > 0.1 && [Mllvv] > 0.0 ) : 1. }

#####################################
########  MET quantities ############
