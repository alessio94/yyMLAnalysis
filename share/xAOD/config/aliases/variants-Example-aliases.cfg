### DLT Cases ### (Not Working right now, causing one sided FF systematics)
# These lines are supposed to determine if the Lead/sublead Anti ID lepton fired the DL trigger or not. and the apply a bias correction is thats the case
# lead is AntiID, sublead is ID: apply FF and triggercorrection to lead
# aliases.trigBias_DLT_lep0: "( (  [leadLepAntiID]>0     ) ? [FakeFactorWeight_DLtrig_lep0] : 1.)"
# lead is ID, sublead is AntiID: apply FF and triggercorrection to sublead
# aliases.trigBias_DLT_lep1: "( (  [subleadLepAntiID]>0  ) ? [FakeFactorWeight_DLtrig_lep1] : 1.)"

### SLT Cases ###
# lead ID fired, sublead antiID fired or not doesn't matter: apply FF to sublead, no trig corr needed.
# lead antiID fired or not doesn't matter, sublead ID fired: apply FF to lead, no trig corr needed.
# lead ID not fired, sublead antiID fired: apply FF and triggercorrection to sublead
aliases.SLT_case1: "( ( [leadLepID]>0 && !([lep0FiredSingleLepTrigger]) && [subleadLepAntiID]>0 && [lep1FiredSingleLepTrigger] ) ?  [FakeFactorWeight_trig_lep1] : 1.)"
# lead antiID fired, sublead ID not fired: apply FF and triggercorrection to lead
aliases.SLT_case2: "( ( ([leadLepAntiID]>0) && [lep0FiredSingleLepTrigger] && [subleadLepID]>0 && !([lep1FiredSingleLepTrigger]) ) ?  [FakeFactorWeight_trig_lep0] : 1.)"
# lead antiID not fired, sublead antiID fired: apply FF to lead, apply FF and triggercorrection to sublead
aliases.both_SLT_QCD_case1: "( ( ([leadLepAntiID]>0) && !([lep0FiredSingleLepTrigger]) && [subleadLepAntiID]>0 && [lep1FiredSingleLepTrigger] ) ?  [FakeFactorWeight_trig_lep1]  : 1.)"
# lead antiID fired, sublead antiID not fired: apply FF to sublead, apply FF and triggercorrection to lead
aliases.both_SLT_QCD_case2: "( ( ([leadLepAntiID]>0) && [lep0FiredSingleLepTrigger] && [subleadLepAntiID]>0 && !([lep1FiredSingleLepTrigger]) ) ?  [FakeFactorWeight_trig_lep0] : 1.)"
# lead antiID fired, sublead antiID fired: apply FF and triggercorrection to both then substract a double fakes term to avoid double counting
aliases.both_SLT_QCD_case3: "( ( ([leadLepAntiID]>0) && [lep0FiredSingleLepTrigger] && [subleadLepAntiID]>0 && [lep1FiredSingleLepTrigger] ) ?   -1. * ( [FakeFactorWeight_trig_lep0]*[FakeFactorWeight_trig_lep1] - [FakeFactorWeight_trig_lep0]-[FakeFactorWeight_trig_lep1] ) : 1.)" # the minus is there in the nominal FF application so the signs are inverted w.r.t the slides.

### Combine DLT and SLT Cases ###
aliases.trigBias_SLT: "$(SLT_case1) * $(SLT_case2) * $(both_SLT_QCD_case1) * $(both_SLT_QCD_case2) * $(both_SLT_QCD_case3)"
# If the SLT case is false and the DLT case is true, then we apply the DLT bias correction (Currently causing problems, hence disabled)
# aliases.trigBias_DLT: "( ( !([leadLepID]>0 && [lep0FiredSingleLepTrigger]) && !([subleadLepID]>0 && [lep1FiredSingleLepTrigger]) && ([lep0FiredDiLepLegTrigger] && [lep1FiredDiLepLegTrigger]) ) ? $(trigBias_DLT_lep0) * $(trigBias_DLT_lep1)  : 1. )"
# For now hardcoding the DLT bias correction to 1.0
aliases.trigBias_DLT: "1."
aliases.trigBias:  "( ([leadLepID]>0 && [lep0FiredSingleLepTrigger]) || ([subleadLepID]>0 && [lep1FiredSingleLepTrigger])  ? 1. : ( ([lep0FiredDiLepLegTrigger] && [lep1FiredDiLepLegTrigger]) ? $(trigBias_DLT) : $(trigBias_SLT) ) )"

